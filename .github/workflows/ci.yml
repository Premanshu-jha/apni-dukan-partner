name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies (high and critical fail the build, except the dated list in scripts/audit.mjs)
        run: node scripts/audit.mjs
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
      # The kirana switch on (VITE_KIRANA_ENABLED=true) must build too; the default build above has it off
      - name: Build with the kirana switch on
        run: npx vite build --outDir dist-kirana
        env:
          VITE_KIRANA_ENABLED: 'true'

  e2e:
    # A real browser drives the app through the main journeys, against the fake backend in e2e/mockApi.ts.
    # Two builds (playwright.config.ts): the default one, kirana switch off, runs the salon specs; one built with
    # VITE_KIRANA_ENABLED=true runs only the kirana specs (e2e/kirana-*.spec.ts).
    # Pinned to 24.04: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  headers:
    # The production server as Railway runs it (Caddy with this repo's Caddyfile, the build at /app/dist) must send
    # the security headers on every page
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build as for production
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com
          VITE_TURNSTILE_SITE_KEY: test-site-key
      - name: Start Caddy with the Caddyfile
        run: |
          docker run -d --name caddy -p 8080:8080 -e PORT=8080 \
            -v "$PWD/Caddyfile:/Caddyfile:ro" -v "$PWD/dist:/app/dist:ro" \
            caddy:2 caddy run --config /Caddyfile --adapter caddyfile
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 1; done
      - name: Check the headers
        run: node scripts/check-headers.mjs http://localhost:8080
      - name: Caddy's log
        if: failure()
        run: docker logs caddy

  android:
    # The Play Store app: the website built for the app (APP_BUILD=true, see vite.config.ts) inside Capacitor's Android
    # project (android/). Every run makes an installable test APK (app-debug.apk, under the run's Artifacts); with the
    # upload key in the secrets it also makes the signed bundle for the Play Store (app-release.aab).
    # Settings (Settings › Secrets and variables › Actions): variables VITE_API_URL, VITE_TURNSTILE_SITE_KEY,
    # VITE_MAP_TILES, VITE_SUPPORT_EMAIL, PHOTO_ORIGIN (the website's, as on Railway); secrets GOOGLE_SERVICES_JSON
    # (Firebase's app file: notifications), ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
    # ANDROID_KEY_PASSWORD (the upload key). Without them the build still runs, pointing at a placeholder backend.
    # Screen updates (see "App updates" in the README): variable CAPGO_PUBLIC_KEY (built into the app: it installs
    # only screens signed with the matching private key); secrets CAPGO_PRIVATE_KEY and APP_RELEASE_TOKEN (after a
    # merge to main this job signs the screens it built and sends them to the backend: phones get them at their next
    # start). Without them the app downloads no screen updates and none are sent.
    runs-on: ubuntu-24.04
    env:
      CAPGO_PUBLIC_KEY: ${{ vars.CAPGO_PUBLIC_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.example.com' }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_MAP_TILES: ${{ vars.VITE_MAP_TILES }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      PHOTO_ORIGIN: ${{ vars.PHOTO_ORIGIN }}
      # Google compares this number to decide what is newer: it grows with every run
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The native level check compares with the PR's target or the commit before the push
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: A change to the native part raises android/native-level
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/check-native-level.mjs "$BASE"
      - name: Firebase's app file, when it is set (notifications in the app)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_APP_PUSH=true" >> "$GITHUB_ENV"
          else
            echo "::notice title=Android::No GOOGLE_SERVICES_JSON secret: the app is built without notifications"
          fi
      - name: Build the website for the app and copy it into android/
        run: npm run android
      - name: Build the test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: The upload key, when it is set
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice title=Android::No upload key in the secrets: only the test APK is built"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > android/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - name: Build the signed Play Store bundle
        if: hashFiles('android/keystore.properties') != ''
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - name: Send the screens as an update for the app (after a merge to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
          CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
        run: node scripts/release-screens.mjs
      - name: Forget the upload key
        if: always()
        run: rm -f android/upload.jks android/keystore.properties android/app/google-services.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clozest-partner-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
