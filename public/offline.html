<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f26" />
    <title>You're offline · Clozest Partner</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/offline.css" />
    <!-- Its lines in the language chosen in the app -->
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <!-- Shown by the service worker when the app is opened without a connection (sw.js keeps it, its CSS, script and icon). -->
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1 id="offline-heading">You're offline</h1>
      <p id="offline-body">Clozest Partner needs the internet to show your shop's day. Check your connection, then try again.</p>
      <a id="offline-retry" href="">Try again</a>
      <!-- Wi-Fi down at opening time: a person to call, with the number shown (src/lib/business.ts BUSINESS.phone) -->
      <p id="offline-urgent">Urgent? Call us or WhatsApp us: +91 93812 51613</p>
      <div class="contact">
        <a id="offline-call" class="secondary" href="tel:+919381251613">Call us</a>
        <a id="offline-whatsapp" class="secondary" href="https://wa.me/919381251613?text=Hello%20Clozest%2C%20I%20need%20help.%20Screen%3A%20Offline">WhatsApp us</a>
      </div>
      <p id="offline-hours" class="small">Calls 10 AM–7 PM · WhatsApp anytime</p>
    </main>
  </body>
</html>
