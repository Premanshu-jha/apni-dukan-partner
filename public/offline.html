<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>You're offline · Apni Dukan Partner</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <!-- Shown by the service worker when the app is opened without a connection (sw.js keeps it, its CSS and icon). -->
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>Apni Dukan Partner needs the internet to show your salon's day. Check your connection, then try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
