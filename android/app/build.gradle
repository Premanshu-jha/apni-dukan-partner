import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The version shown in the Play Store is the website's (package.json); the number Google compares (versionCode) must
// grow with every upload: CI passes ANDROID_VERSION_CODE (its run number), a build on a laptop gets 1.
def webVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def versionNumber = (System.getenv('ANDROID_VERSION_CODE') ?: '1') as Integer

// The native part's level (android/native-level): raised whenever the screens need native code an older app doesn't
// have (a new plugin or a change to one of ours). A screen update is only offered to apps of at least its level (see
// "App updates" in the README; CI's check-native-level refuses such a change without the raise).
def nativeLevel = rootProject.file('native-level').text.trim() as Integer

// The upload key for the Play Store (never committed): android/keystore.properties, which CI writes from GitHub
// secrets. Without it the release build is unsigned and only the debug build can be installed.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

android {
    namespace = "com.clozest.partner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.clozest.partner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionNumber
        versionName webVersion
        buildConfigField "int", "NATIVE_LEVEL", "${nativeLevel}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Sign-out tells Firebase to drop this phone's token and waits for its answer (AppSettingsPlugin.dropPushToken)
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    // Paying the subscription in the app: Google's choice screen (user choice billing) and Google Play's payment
    implementation "com.android.billingclient:billing:$playBillingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
